# Separate sports test instance for Docker Desktop.
#
# This file deliberately uses a unique Compose project, container name, and
# host port so it does not collide with the working m3u-picker instance.
#
# Start it from this directory with exactly:
#   docker compose -f docker-compose.sports-debug.yml up -d --build
#
# Open:
#   http://localhost:10000
#
# Stop/remove only this test instance:
#   docker compose -f docker-compose.sports-debug.yml down
name: m3u-picker-sports-test

services:
  m3u-picker-sports-test:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: m3u-picker-sports-test

    ports:
      # Host port 10000 maps to Flask's debug port 9998 inside this container.
      - "10000:9998"

    environment:
      FLASK_DEBUG: "1"
      PYTHONUNBUFFERED: "1"

      # Keep nightly host backups disabled in the disposable debug instance.
      # The normal docker-compose.yml enables them for the long-running app.
      M3U_BACKUP_ENABLED: "false"
      M3U_DATA_DIR: /app/debug-data
      M3U_MAX_PROVIDER_CHANNELS: "${M3U_MAX_PROVIDER_CHANNELS:-50000}"
      M3U_PROVIDER_CHANNEL_WARNING: "${M3U_PROVIDER_CHANNEL_WARNING:-20000}"
      M3U_MAX_PROVIDER_PLAYLIST_BYTES: "${M3U_MAX_PROVIDER_PLAYLIST_BYTES:-100663296}"
      M3U_MAX_PROVIDER_JSON_BYTES: "${M3U_MAX_PROVIDER_JSON_BYTES:-100663296}"
      M3U_MAX_PUBLIC_EPG_COMPRESSED_BYTES: "${M3U_MAX_PUBLIC_EPG_COMPRESSED_BYTES:-268435456}"

    # Override the production Waitress command and enable Flask debug mode.
    command: ["python", "app.py", "--dev"]

    # Mount application source files/directories for real debug reloads.
    # Runtime state lives in ./debug-data so --force-recreate no longer erases it.
    volumes:
      - type: bind
        source: ./app.py
        target: /app/app.py
      - type: bind
        source: ./core.py
        target: /app/core.py
      - type: bind
        source: ./sports.py
        target: /app/sports.py
      - type: bind
        source: ./backup.py
        target: /app/backup.py
      - type: bind
        source: ./api
        target: /app/api
      - type: bind
        source: ./static
        target: /app/static
      - type: bind
        source: ./templates
        target: /app/templates
      - type: bind
        source: ./debug-data
        target: /app/debug-data

    restart: unless-stopped
