# Experimental first-run / Jellyfin integration instance.
#
# This branch deliberately runs as a separate -dev Compose project on host port
# 9998 so it can coexist with the normal m3u-picker instance. Its data volume is
# disposable by design: onboarding tests should start with `docker compose down
# -v` so the first-run wizard sees a genuinely fresh application state.
#
# Optional Jellyfin cache integration:
#   M3U_JELLYFIN_CACHE_DIR=/absolute/path/to/jellyfin/cache docker compose up -d --build
# The wizard asks the user to paste that same host path and will refuse to
# enable deletion unless the bind mount is present and writable.

name: m3u-picker-dev

services:
  m3u-picker:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: m3u-picker-dev

    ports:
      - "${M3U_HOST_PORT:-9998}:9999"

    environment:
      PYTHONUNBUFFERED: "1"
      M3U_DEV_ONBOARDING: "true"
      M3U_BACKUP_ENABLED: "true"
      M3U_DATA_DIR: /app/data
      M3U_LAN_HOST: "${M3U_LAN_HOST:-10.0.0.22}"
      M3U_EXTERNAL_PORT: "${M3U_EXTERNAL_PORT:-9998}"
      M3U_MAX_PROVIDER_CHANNELS: "${M3U_MAX_PROVIDER_CHANNELS:-50000}"
      M3U_PROVIDER_CHANNEL_WARNING: "${M3U_PROVIDER_CHANNEL_WARNING:-20000}"
      M3U_MAX_PROVIDER_PLAYLIST_BYTES: "${M3U_MAX_PROVIDER_PLAYLIST_BYTES:-100663296}"
      M3U_MAX_PROVIDER_JSON_BYTES: "${M3U_MAX_PROVIDER_JSON_BYTES:-100663296}"
      M3U_MAX_PUBLIC_EPG_COMPRESSED_BYTES: "${M3U_MAX_PUBLIC_EPG_COMPRESSED_BYTES:-268435456}"
      M3U_BACKUP_CONTAINER_DIR: /backups
      M3U_JELLYFIN_CACHE_HOST_DIR: "${M3U_JELLYFIN_CACHE_DIR:-}"
      M3U_JELLYFIN_CACHE_CONTAINER_DIR: /jellyfin-cache
      BACKUP_TIME: "03:15"
      BACKUP_TIMEZONE: "America/New_York"
      BACKUP_RETENTION_DAYS: "30"
      MASTER_REFRESH_HOUR: "3"
      MASTER_REFRESH_MINUTE: "0"

    volumes:
      - type: bind
        source: "${M3U_BACKUP_DIR:-./data/backups-dev}"
        target: /backups
      - type: bind
        source: "${M3U_JELLYFIN_CACHE_DIR:-./data/jellyfin-cache-disabled}"
        target: /jellyfin-cache
      - type: volume
        source: m3u-picker-dev-data
        target: /app/data

    restart: unless-stopped

volumes:
  m3u-picker-dev-data:
