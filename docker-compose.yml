# v30-experiments: disposable/isolated debug stack.
#
# This intentionally does NOT use the normal m3u-picker container name,
# normal named volume, normal backup folder, or normal host port.
# It is safe to run beside the stable main instance.
#
# Start:
#   docker compose up -d --build
#
# Open:
#   http://localhost:10000  (Cast control on this Mac)
#   http://10.0.0.22:10000  (LAN access / Chromecast/Roku media relay)
#   http://10.0.0.22        (HDHomeRun/Jellyfin bare-IP compatibility)
#
# Stop/remove only this experiment:
#   docker compose down
#
# Reset ONLY the experimental state:
#   docker compose down
#   rm -rf debug-data
#   mkdir -p debug-data

name: m3u-picker-v30-experiments

services:
  m3u-picker-v30-experiments:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: m3u-picker-v30-experiments

    ports:
      # Normal experimental UI/media path.
      - "0.0.0.0:10000:9998"
      # Jellyfin HDHomeRun discovery follows the UDP reply with a bare-IP
      # http://<device-ip>/discover.json request, so expose the same Flask app
      # directly on host port 80 instead of requiring hdhr_port80_proxy.py.
      - "0.0.0.0:80:9998"

    environment:
      FLASK_DEBUG: "1"
      PYTHONUNBUFFERED: "1"
      M3U_BACKUP_ENABLED: "false"
      # exp8: the Chromecast/Google TV and Roku fetch HLS from the Mac over the LAN.
      M3U_LAN_HOST: "${M3U_LAN_HOST:-10.0.0.22}"
      M3U_EXTERNAL_PORT: "${M3U_EXTERNAL_PORT:-10000}"
      M3U_DATA_DIR: /app/debug-data
      M3U_MAX_PROVIDER_CHANNELS: "${M3U_MAX_PROVIDER_CHANNELS:-50000}"
      M3U_PROVIDER_CHANNEL_WARNING: "${M3U_PROVIDER_CHANNEL_WARNING:-20000}"
      M3U_MAX_PROVIDER_PLAYLIST_BYTES: "${M3U_MAX_PROVIDER_PLAYLIST_BYTES:-100663296}"
      M3U_MAX_PROVIDER_JSON_BYTES: "${M3U_MAX_PROVIDER_JSON_BYTES:-100663296}"
      M3U_MAX_PUBLIC_EPG_COMPRESSED_BYTES: "${M3U_MAX_PUBLIC_EPG_COMPRESSED_BYTES:-268435456}"

    # Debug/reloader mode is deliberate for v30-experiments.
    command: ["python", "app.py", "--dev"]

    # Bind the source tree for fast experiments while keeping runtime state in
    # this download's ./debug-data folder only.
    volumes:
      - type: bind
        source: ./app.py
        target: /app/app.py
      - type: bind
        source: ./core.py
        target: /app/core.py
      - type: bind
        source: ./hdhr_config.py
        target: /app/hdhr_config.py
      - type: bind
        source: ./sports
        target: /app/sports
      - type: bind
        source: ./backup.py
        target: /app/backup.py
      - type: bind
        source: ./api
        target: /app/api
      - type: bind
        source: ./static
        target: /app/static
      - type: bind
        source: ./templates
        target: /app/templates
      - type: bind
        source: ./debug-data
        target: /app/debug-data

    restart: unless-stopped

  # Keep HDHomeRun UDP discovery under Compose too. Docker Desktop's normal
  # published-port path did not pass Jellyfin's LAN broadcast into a bridged
  # container, so this tiny responder uses Docker Desktop host networking.
  # The actual Flask app, streams, lineup and EPG stay in the normal container.
  m3u-picker-v30-hdhr-discovery:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: m3u-picker-v30-hdhr-discovery
    network_mode: host

    environment:
      PYTHONUNBUFFERED: "1"
      M3U_LAN_HOST: "${M3U_LAN_HOST:-10.0.0.22}"
      M3U_EXTERNAL_PORT: "${M3U_EXTERNAL_PORT:-10000}"
      # With Docker Desktop host networking enabled, localhost reaches services
      # published by the Mac host. Use that path only for polling the HDHR toggle;
      # discovery replies still advertise the real LAN address above.
      M3U_HDHR_STATUS_BASE_URL: "http://127.0.0.1:${M3U_EXTERNAL_PORT:-10000}"

    command: ["python", "tools/hdhr_discovery_container.py"]

    depends_on:
      - m3u-picker-v30-experiments

    restart: unless-stopped
