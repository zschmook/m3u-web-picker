# Isolated clean-install / setup-wizard test stack.
#
# This project intentionally uses host port 9998 and a separate disposable data
# volume so it can coexist with the normal m3u-picker stack. Use `down -v` when
# testing first-run behavior so the wizard sees a genuinely blank database.

name: m3u-picker-dev

services:
  m3u-picker:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: m3u-picker-dev

    # Docker Desktop/WSL exposes the Dell's NVIDIA GPU to FFmpeg. The
    # application still probes NVENC and falls back to libx264 if unavailable.
    gpus: all

    ports:
      - "${M3U_DEV_HOST_PORT:-9998}:9999"

    environment:
      PYTHONUNBUFFERED: "1"
      M3U_ONBOARDING_ENABLED: "true"
      M3U_DEBUG_TOOLS: "true"
      M3U_MULTIVIEW_ENCODER: "${M3U_MULTIVIEW_ENCODER:-auto}"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility,video"
      M3U_BACKUP_ENABLED: "true"
      M3U_DATA_DIR: /app/data
      M3U_LAN_HOST: "${M3U_LAN_HOST:-}"
      M3U_EXTERNAL_PORT: "${M3U_DEV_EXTERNAL_PORT:-9998}"
      M3U_MAX_PROVIDER_CHANNELS: "${M3U_MAX_PROVIDER_CHANNELS:-50000}"
      M3U_PROVIDER_CHANNEL_WARNING: "${M3U_PROVIDER_CHANNEL_WARNING:-20000}"
      M3U_MAX_PROVIDER_PLAYLIST_BYTES: "${M3U_MAX_PROVIDER_PLAYLIST_BYTES:-100663296}"
      M3U_MAX_PROVIDER_JSON_BYTES: "${M3U_MAX_PROVIDER_JSON_BYTES:-100663296}"
      M3U_MAX_PUBLIC_EPG_COMPRESSED_BYTES: "${M3U_MAX_PUBLIC_EPG_COMPRESSED_BYTES:-268435456}"
      M3U_BACKUP_CONTAINER_DIR: /backups
      M3U_JELLYFIN_CACHE_HOST_DIR: "${M3U_JELLYFIN_CACHE_DIR:-}"
      M3U_JELLYFIN_CACHE_CONTAINER_DIR: /jellyfin-cache
      BACKUP_TIME: "03:15"
      BACKUP_TIMEZONE: "America/New_York"
      BACKUP_RETENTION_DAYS: "30"
      MASTER_REFRESH_HOUR: "3"
      MASTER_REFRESH_MINUTE: "0"

    volumes:
      - type: bind
        source: "${M3U_DEV_BACKUP_DIR:-./data/backups-dev}"
        target: /backups
      - type: bind
        source: "${M3U_JELLYFIN_CACHE_DIR:-./data/jellyfin-cache-disabled}"
        target: /jellyfin-cache
      - type: volume
        source: m3u-picker-dev-data
        target: /app/data

    restart: unless-stopped

volumes:
  m3u-picker-dev-data:
