name: Dev onboarding baseline tests

"on":
  push:
    branches:
      - "agent/dev-onboarding"

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      M3U_DISABLE_SCHEDULER: "true"
      M3U_DATA_DIR: /tmp/m3u-picker-baseline-test-data
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out pre-lifecycle branch state
        uses: actions/checkout@v4
        with:
          ref: 4f4bd4b18abe63288b41d4c4b549ad9ef3301a2c

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run all baseline tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
