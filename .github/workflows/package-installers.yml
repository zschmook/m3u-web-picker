name: Package installers

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional release tag to create/update (leave blank for build artifacts only)
        required: false
        type: string
  release:
    types: [published]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build Windows installer
        run: python installer/windows-python/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: M3U-Web-Picker-Windows-Setup
          path: installer/windows-python/dist/M3U-Web-Picker-Windows-Setup.exe
          retention-days: 30

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package macOS installer DMG
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/dmg-root
          cp installer/macos/install.command dist/dmg-root/Install\ M3U\ Web\ Picker.command
          cp installer/macos/uninstall.command dist/dmg-root/Uninstall\ M3U\ Web\ Picker.command
          cp installer/macos/README.md dist/dmg-root/README.md
          chmod +x dist/dmg-root/*.command
          hdiutil create \
            -volname "M3U Web Picker" \
            -srcfolder dist/dmg-root \
            -ov \
            -format UDZO \
            dist/M3U-Web-Picker-macOS.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: M3U-Web-Picker-macOS
          path: dist/M3U-Web-Picker-macOS.dmg
          retention-days: 30

  attach-to-release:
    if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') }}
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create or update release and attach packaged downloads
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          find dist -maxdepth 1 -type f -print
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --generate-notes \
              --repo "$GITHUB_REPOSITORY"
          fi
          gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          echo "Windows: https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/M3U-Web-Picker-Windows-Setup.exe"
          echo "macOS: https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/M3U-Web-Picker-macOS.dmg"
