name: Package installers

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional release tag to create/update (leave blank for build artifacts only)
        required: false
        type: string
  release:
    types: [published]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.event.release.tag_name || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build Windows Docker installer
        # Lifecycle tests are stdlib-only and do not touch the runner's Docker.
        run: |
          python -m unittest tests.test_packaged_vpn_helper tests.test_cross_platform_docker_installer
          python installer/docker/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: M3U-Web-Picker-Windows-Setup
          path: installer/docker/dist/M3U-Web-Picker-Windows-Setup.exe
          retention-days: 30

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.event.release.tag_name || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build universal macOS Docker installer
        run: |
          python -m unittest tests.test_packaged_vpn_helper tests.test_cross_platform_docker_installer
          python installer/docker/build.py
      - name: Package macOS installer DMG
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/dmg-root
          cp installer/docker/dist/M3U-Web-Picker-macOS-Setup dist/dmg-root/Install\ M3U\ Web\ Picker
          cp installer/docker/README.md dist/dmg-root/README.md
          chmod +x dist/dmg-root/Install\ M3U\ Web\ Picker
          hdiutil create \
            -volname "M3U Web Picker" \
            -srcfolder dist/dmg-root \
            -ov \
            -format UDZO \
            dist/M3U-Web-Picker-macOS.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: M3U-Web-Picker-macOS
          path: dist/M3U-Web-Picker-macOS.dmg
          retention-days: 30

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.event.release.tag_name || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build Linux Docker installer
        run: |
          python -m unittest tests.test_packaged_vpn_helper tests.test_cross_platform_docker_installer
          python installer/docker/build.py
      - name: Include readable Python fallback
        run: cp installer/docker/install.py installer/docker/dist/M3U-Web-Picker-Linux-Setup.py
      - name: Package Linux installer
        run: |
          tar -C installer/docker/dist -czf installer/docker/M3U-Web-Picker-Linux.tar.gz \
            M3U-Web-Picker-Linux-Setup M3U-Web-Picker-Linux-Setup.py M3U-Web-Picker-VPN-Helper helper_service.py vpn_helper.py
      - uses: actions/upload-artifact@v4
        with:
          name: M3U-Web-Picker-Linux-Setup
          path: installer/docker/M3U-Web-Picker-Linux.tar.gz
          retention-days: 30

  attach-to-release:
    if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') }}
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create or update release and attach packaged downloads
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          find dist -maxdepth 1 -type f -print
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --generate-notes \
              --repo "$GITHUB_REPOSITORY"
          fi
          gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          echo "Windows: https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/M3U-Web-Picker-Windows-Setup.exe"
          echo "macOS: https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/M3U-Web-Picker-macOS.dmg"
          echo "Linux: https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/M3U-Web-Picker-Linux.tar.gz"
