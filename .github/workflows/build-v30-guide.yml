name: Assemble current v30 user guide

on:
  push:
    branches:
      - main
    paths:
      - guide_pdf_chunks_v30/READY

permissions:
  contents: write

jobs:
  build-guide:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Assemble and verify PDF
        shell: bash
        run: |
          cat guide_pdf_chunks_v30/part-*.b64 | tr -d '\n\r' | base64 --decode > M3U-Web-Picker-v30-User-Guide.pdf
          test -s M3U-Web-Picker-v30-User-Guide.pdf
          head -c 4 M3U-Web-Picker-v30-User-Guide.pdf | grep -q '%PDF'
          echo "f48a554fb2ce988d283cbb8911f4ddc26150fd256b8f671c4774b3c5124a06b7  M3U-Web-Picker-v30-User-Guide.pdf" | sha256sum -c -

      - name: Commit guide and remove transfer artifacts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add M3U-Web-Picker-v30-User-Guide.pdf
          git rm -r guide_pdf_chunks_v30
          git rm -r guide_pdf_chunks || true
          git rm M3U-Web-Picker-v22.1-RC5-User-Guide.pdf || true
          git rm .github/workflows/build-v30-guide.yml
          git commit -m "Replace legacy user guide with v30 guide"
          git push origin HEAD:main
