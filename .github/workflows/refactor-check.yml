name: Refactor Check

on:
  push:
    branches:
      - experiments-refacor-work
  pull_request:
    branches:
      - experiments-refacor
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Audit sports function sizes
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          offenders = []
          paths = [p for p in [Path('sports.py'), *sorted(Path('sports').glob('*.py'))] if p.exists()]
          for path in paths:
              tree = ast.parse(path.read_text(encoding='utf-8'))
              print(f'=== {path} ===')
              for node in tree.body:
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)):
                      end = getattr(node, 'end_lineno', node.lineno)
                      size = end - node.lineno + 1
                      print(f'{node.name}\t{node.lineno}-{end}\t{size}')
                      if size > 500:
                          offenders.append(f'{path}:{node.name}={size}')
          if offenders:
              raise SystemExit('Sports functions/classes over 500 lines: ' + ', '.join(offenders))
          PY
      - name: Run unit tests
        env:
          M3U_DISABLE_SCHEDULER: 'true'
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee test-output.txt
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refactor-test-output
          path: test-output.txt
          retention-days: 1
