name: Release main

on:
  push:
    branches: [main]
  workflow_dispatch:

# Different pushes must all get a release. Only duplicate runs of one commit
# share a concurrency group; do not cancel older main pushes.
concurrency:
  group: release-main-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  actions: write

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      image: ${{ steps.release.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Reserve tag and draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release_main.py prepare

  image:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and publish versioned image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.tag }}
          build-args: APP_VERSION=${{ needs.prepare.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test published image
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.tag }}
        run: |
          docker run --rm --entrypoint python "$IMAGE" -c 'import flask, markdown, src.app; import subprocess; subprocess.run(["ffmpeg", "-version"], check=True, stdout=subprocess.DEVNULL)'
          docker run --rm --entrypoint python "$IMAGE" -m unittest tests.test_roku_app tests.test_shared_media_sessions tests.test_hls_manifest tests.test_live_read_ahead tests.test_movie_lighting tests.test_hls_audio_clock tests.test_hls_recovery_continuity tests.test_release_main tests.test_cross_platform_docker_installer tests.test_plex_auth tests.test_plex_discovery tests.test_minor_hockey

  publish:
    needs: [prepare, image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Verify image is public
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          # A private package needs its visibility changed to Public first.
          # Never advertise a release that anonymous users cannot pull.
          python scripts/release_main.py verify
      - name: Upload assets to the reserved release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: python scripts/release_main.py upload
      - name: Promote current main image to latest
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ needs.prepare.outputs.image }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)
          if [ "$head" = "$GITHUB_SHA" ]; then
            docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:$TAG"
          fi
      - name: Publish completed release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: python scripts/release_main.py publish
      - name: Start existing installer packaging separately
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh workflow run package-installers.yml --ref main -f release_tag="$TAG" --repo "$GITHUB_REPOSITORY"
