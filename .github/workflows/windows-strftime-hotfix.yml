name: Windows strftime portability hotfix

on:
  push:
    branches:
      - installer
    paths:
      - .github/workflows/windows-strftime-hotfix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: installer

      - name: Replace Unix-only strftime modifiers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          scan = Path('sports/scan.py')
          text = scan.read_text(encoding='utf-8')
          old = '.strftime("%-I:%M %p")'
          new = '.strftime("%I:%M %p").lstrip("0")'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly 1 scan.py Unix-only clock format, found {count}')
          scan.write_text(text.replace(old, new), encoding='utf-8')

          guide = Path('sports/guide.py')
          text = guide.read_text(encoding='utf-8')
          replacements = {
              'primary_start.strftime("%A, %B %-d at %-I:%M %p %Z")':
                  'primary_start.strftime("%A, %B %d at %I:%M %p %Z").replace(" 0", " ")',
              'local_start.strftime("%A, %B %-d at %-I:%M %p %Z")':
                  'local_start.strftime("%A, %B %d at %I:%M %p %Z").replace(" 0", " ")',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly 1 guide.py occurrence of {old!r}, found {count}')
              text = text.replace(old, new)
          guide.write_text(text, encoding='utf-8')

          leftovers = []
          for path in Path('.').rglob('*.py'):
              try:
                  source = path.read_text(encoding='utf-8')
              except (OSError, UnicodeError):
                  continue
              if '%-' in source:
                  leftovers.append(str(path))
          if leftovers:
              raise SystemExit('Unix-only strftime modifiers remain in: ' + ', '.join(leftovers))
          PY

      - name: Compile changed modules
        run: python -m py_compile sports/scan.py sports/guide.py

      - name: Commit portability fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sports/scan.py sports/guide.py
          git diff --cached --check
          git commit -m "Fix Windows sports time formatting"
          git push origin HEAD:installer
