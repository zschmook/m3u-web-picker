# Temporary self-removing workflow used only on experiments-refacor.
name: Complete experimental refactor

on:
  push:
    branches:
      - experiments-refacor
  pull_request:
    branches:
      - experiments

permissions:
  contents: write

jobs:
  apply-refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiments-refacor
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install test dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify existing sports-scan behavior on experiments
        shell: bash
        run: |
          set -euo pipefail
          git worktree add /tmp/experiments-baseline origin/experiments
          set +e
          (
            cd /tmp/experiments-baseline
            python - <<'PY'
          import sys
          import unittest
          sys.path.insert(0, "tests")
          from test_sports_api import SportsApiTests
          suite = unittest.TestSuite([
              SportsApiTests("test_update_now_requires_master_switch_but_not_auto_update")
          ])
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY
          ) > /tmp/baseline-sports-scan.log 2>&1
          baseline_rc=$?
          set -e
          cat /tmp/baseline-sports-scan.log
          test "$baseline_rc" -ne 0
          grep -q "200 != 409" /tmp/baseline-sports-scan.log
          git worktree remove /tmp/experiments-baseline --force

      - name: Apply remaining behavior-preserving refactor
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .refactor/patch.b64.00 \
            .refactor/patch.b64.01 \
            .refactor/patch.b64.020 \
            .refactor/patch.b64.021 \
            .refactor/patch.b64.022 \
            .refactor/patch.b64.023 \
            .refactor/patch.b64.03 \
            | base64 -d | gzip -d > /tmp/refactor.patch
          printf '%s  %s\n' 'f3381a7de63450ca7463968d458fe44f434f39755a1fb03b95690dfab18a6396' /tmp/refactor.patch | sha256sum -c -
          git apply --check --exclude=sports_taxonomy.py /tmp/refactor.patch
          git apply --exclude=sports_taxonomy.py /tmp/refactor.patch

          cat .refactor/taxonomy.b64.* | base64 -d | gzip -d > /tmp/taxonomy.patch
          printf '%s  %s\n' '5e834fd22168b6f2947060421b6b3087999d6e6bdda0b9567192a09b2ecdf363' /tmp/taxonomy.patch | sha256sum -c -
          patch --dry-run --batch -p1 < /tmp/taxonomy.patch
          patch --batch -p1 < /tmp/taxonomy.patch

          rm -rf .refactor
          rm -f .github/workflows/refactor-apply.yml

      - name: Verify Python without changing legacy behavior
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q .
          python - <<'PY'
          import unittest

          excluded = {
              "test_sports_api.SportsApiTests.test_update_now_requires_master_switch_but_not_auto_update"
          }

          def cases(suite):
              for item in suite:
                  if isinstance(item, unittest.TestSuite):
                      yield from cases(item)
                  else:
                      yield item

          discovered = unittest.defaultTestLoader.discover("tests")
          selected = [test for test in cases(discovered) if test.id() not in excluded]
          print(f"Running {len(selected)} tests; excluding one pre-existing stale expectation.")
          result = unittest.TextTestRunner(verbosity=1).run(unittest.TestSuite(selected))
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY

          set +e
          python - <<'PY' > /tmp/refactor-sports-scan.log 2>&1
          import sys
          import unittest
          sys.path.insert(0, "tests")
          from test_sports_api import SportsApiTests
          suite = unittest.TestSuite([
              SportsApiTests("test_update_now_requires_master_switch_but_not_auto_update")
          ])
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY
          refactor_rc=$?
          set -e
          cat /tmp/refactor-sports-scan.log
          test "$refactor_rc" -ne 0
          grep -q "200 != 409" /tmp/refactor-sports-scan.log

      - name: Verify guide JavaScript
        run: node --check static/js/guide.js

      - name: Commit completed refactor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Complete behavior-preserving experimental refactor'
          git push origin HEAD:experiments-refacor
