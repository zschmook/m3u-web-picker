name: Build corrected Windows dev installer once

on:
  push:
    branches:
      - agent/windows-python-dev-m3u

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build Windows dev installer
        run: python installer/windows-dev/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: M3U-Web-Picker-Python-Dev-Setup
          path: installer/windows-dev/dist/M3U-Web-Picker-Python-Dev-Setup.exe
          retention-days: 7
