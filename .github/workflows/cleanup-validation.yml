name: cleanup-validation

on:
  push:
    branches:
      - agent/main-cleanup

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate production Compose
        run: docker compose config -q
      - name: Validate isolated wizard Compose
        run: docker compose -f docker-compose.dev.yml config -q
      - name: Build Docker image
        run: docker build -t m3u-web-picker-cleanup .
      - name: Smoke test blank first-run container
        run: |
          docker run -d --name m3u-web-picker-smoke \
            -e M3U_ONBOARDING_ENABLED=true \
            -e M3U_DATA_DIR=/app/data \
            -p 9999:9999 \
            m3u-web-picker-cleanup
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9999/api/onboarding > /tmp/onboarding.json; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:9999/ > /tmp/index.html
          python - <<'PY'
          import json
          payload = json.load(open('/tmp/onboarding.json', encoding='utf-8'))
          assert payload['enabled'] is True
          assert payload['state']['required'] is True
          assert payload['state']['completed'] is False
          html = open('/tmp/index.html', encoding='utf-8').read()
          assert 'onboarding-pending' in html
          assert '/static/js/onboarding.js' in html
          PY
          docker rm -f m3u-web-picker-smoke
      - name: Compile Python
        run: python -m compileall -q .
      - name: Check JavaScript syntax
        run: find static -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run onboarding and lifecycle tests
        run: python -m unittest tests.test_onboarding tests.test_onboarding_completion tests.test_provider_onboarding_validation tests.test_master_update_api tests.test_master_update_worker tests.test_update_lifecycle_contract
      - name: Run full test suite
        run: python -m unittest discover -s tests
