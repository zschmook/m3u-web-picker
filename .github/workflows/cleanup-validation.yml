name: cleanup-validation

on:
  push:
    branches:
      - agent/main-cleanup

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate production Compose
        run: docker compose config -q
      - name: Validate isolated wizard Compose
        run: docker compose -f docker-compose.dev.yml config -q
      - name: Compile Python
        run: python -m compileall -q .
      - name: Check JavaScript syntax
        run: find static -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run onboarding and lifecycle tests
        run: python -m unittest tests.test_onboarding tests.test_onboarding_completion tests.test_provider_onboarding_validation tests.test_master_update_api tests.test_master_update_worker tests.test_update_lifecycle_contract
      - name: Run full test suite
        run: python -m unittest discover -s tests
