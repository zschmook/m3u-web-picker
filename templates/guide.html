<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>M3U Web Picker — TV Guide</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/guide.css', v='v30-experiments-exp11-roku-bundled') }}">
</head>
<body class="guide-body">
  <main class="guide-shell container-fluid py-3">
    <header class="guide-header mb-3">
      <div class="guide-header-copy">
        <h1 class="h4 mb-1">TV Guide</h1>
        <div id="guideStatus" class="small-muted" aria-live="polite">Loading curated lineup…</div>
      </div>
      <div class="d-flex gap-2 align-items-center">
        <button id="guideCastBtn" class="btn btn-outline-light btn-sm" type="button" disabled title="Looking for Google Cast receivers">Cast</button>
        <button id="guideRokuBtn" class="btn btn-outline-light btn-sm" type="button" disabled title="Looking for Roku devices">Roku</button>
        <button id="guideRefreshBtn" class="btn btn-outline-light btn-sm" type="button">Refresh</button>
        <button id="guideCloseBtn" class="btn btn-outline-light btn-sm" type="button">Close</button>
      </div>
    </header>

    <section id="guidePlayerPanel" class="guide-player-panel d-none mb-3" aria-live="polite">
      <div class="guide-player-heading">
        <div class="guide-player-copy">
          <div class="guide-player-kicker">
            <span id="guidePlaybackBadge" class="badge rounded-pill text-bg-secondary">Local</span>
            <span id="guideNowPlayingLabel" class="small-muted">Now playing</span>
          </div>
          <div id="guidePlayerTitle" class="guide-player-title">—</div>
          <div id="guidePlayerMeta" class="small-muted guide-player-meta"></div>
        </div>
        <div class="guide-player-actions">
          <button id="guideStopBtn" class="btn btn-outline-light btn-sm" type="button">Stop</button>
        </div>
      </div>

      <video id="guidePlayer" class="guide-player" controls controlsList="nodownload" disableRemotePlayback autoplay playsinline preload="none"></video>
      <div id="guideCastScreen" class="guide-cast-screen d-none">
        <div class="guide-cast-icon" aria-hidden="true">▰</div>
        <div class="guide-cast-screen-title"><span id="guideRemoteScreenVerb">Casting to</span> <span id="guideCastScreenDevice">Cast device</span></div>
        <div id="guideCastScreenChannel" class="small-muted"></div>
      </div>

      <div id="guidePlayerMessage" class="guide-player-message small-muted" aria-live="polite"></div>

      <details class="guide-diagnostics">
        <summary>Diagnostics</summary>
        <div class="guide-diagnostics-body">
          <div class="guide-cast-row">
            <span class="guide-cast-host-label">Cast relay</span>
            <code id="guideCastRelay" class="guide-cast-relay">detecting…</code>
            <button id="guideLanTestBtn" class="btn btn-outline-light btn-sm guide-lan-test" type="button">Test LAN</button>
          </div>
          <div id="guideCastStatus" class="small-muted guide-cast-status">Cast SDK loading…</div>
          <div class="guide-roku-row">
            <label class="guide-cast-host-label" for="guideRokuDevice">Roku device</label>
            <select id="guideRokuDevice" class="form-select form-select-sm guide-roku-host" disabled>
              <option value="">Discovering…</option>
            </select>
            <input id="guideRokuHost" type="hidden" value="">
            <button id="guideRokuDiscoverBtn" class="btn btn-outline-light btn-sm" type="button">Rediscover</button>
            <button id="guideRokuTestBtn" class="btn btn-outline-light btn-sm" type="button">Test</button>
          </div>
          <div id="guideRokuStatus" class="small-muted guide-cast-status">Discovering Roku devices…</div>
        </div>
      </details>
    </section>

    <section class="guide-controls mb-3">
      <div class="guide-filter-heading">
        <label class="form-label mb-1" for="guideSearch">Filter channels</label>
        <div id="guideVisibleCount" class="small-muted guide-count">0 channels</div>
      </div>
      <input id="guideSearch" class="form-control" type="search" placeholder="Channel, group, sports event…" autocomplete="off">
    </section>

    <section class="guide-list-wrap">
      <table class="table table-hover align-middle mb-0 guide-table">
        <thead>
          <tr>
            <th scope="col" class="guide-number-col">#</th>
            <th scope="col">Channel</th>
            <th scope="col" class="guide-group-col">Group</th>
            <th scope="col" class="guide-action-col"></th>
          </tr>
        </thead>
        <tbody id="guideRows"></tbody>
      </table>
      <div id="guideEmpty" class="guide-empty d-none">No curated channels match this filter.</div>
    </section>
  </main>

  <script src="{{ url_for('static', filename='js/guide.js', v='v30-experiments-auto-discovery') }}"></script>
  <script>
    (() => {
      const castButton = document.getElementById("guideCastBtn");
      const rokuButton = document.getElementById("guideRokuBtn");
      const rokuDeviceSelect = document.getElementById("guideRokuDevice");
      const rokuDiscoverButton = document.getElementById("guideRokuDiscoverBtn");
      let discoveredRokus = [];
      let castDisconnectSequence = 0;
      let castDisconnectHandoff = null;
      let remoteTransitionBusy = false;

      function sameChannel(left, right) {
        if (!left || !right) return false;
        return String(left.play_url || "") === String(right.play_url || "");
      }

      function syncRemoteButtonStyle(button) {
        const active = String(button?.textContent || "").trim().startsWith("Disconnect");
        button?.classList.toggle("btn-success", active);
        button?.classList.toggle("btn-outline-light", !active);
      }

      const remoteButtonObserver = new MutationObserver(mutations => {
        for (const mutation of mutations) {
          const button = mutation.target?.nodeType === Node.TEXT_NODE
            ? mutation.target.parentElement
            : mutation.target;
          if (button === castButton || button === rokuButton) syncRemoteButtonStyle(button);
        }
      });
      for (const button of [castButton, rokuButton]) {
        syncRemoteButtonStyle(button);
        remoteButtonObserver.observe(button, {childList: true, characterData: true, subtree: true});
      }

      function renderRokuChoices(devices, selectedHost = "") {
        discoveredRokus = Array.isArray(devices) ? devices : [];
        if (!discoveredRokus.length) {
          rokuDeviceSelect.innerHTML = '<option value="">No Roku found</option>';
          rokuDeviceSelect.disabled = true;
          return;
        }
        rokuDeviceSelect.innerHTML = discoveredRokus.map(device => {
          const host = String(device?.host || "").trim();
          const name = String(device?.name || "Roku TV").trim();
          const model = String(device?.model || "").trim();
          const label = `${name}${model ? ` · ${model}` : ""} · ${host}`;
          return `<option value="${escapeHtml(host)}">${escapeHtml(label)}</option>`;
        }).join("");
        rokuDeviceSelect.disabled = false;
        if (selectedHost && discoveredRokus.some(device => device.host === selectedHost)) {
          rokuDeviceSelect.value = selectedHost;
        }
      }

      function clearRokuDiscovery(message) {
        guideState.roku.host = "";
        guideState.roku.deviceName = "Roku TV";
        guideEls.rokuHost.value = "";
        localStorage.removeItem("m3u-guide-roku-host");
        renderRokuChoices([]);
        rokuButton.disabled = true;
        rokuButton.title = "No Roku discovered";
        guideEls.rokuStatus.textContent = message || "No Roku found on the local subnet.";
      }

      function useDiscoveredRoku(device) {
        const host = String(device?.host || "").trim();
        if (!host) return;
        guideState.roku.host = host;
        guideState.roku.deviceName = device?.name || "Roku TV";
        guideEls.rokuHost.value = host;
        if (!rokuDeviceSelect.disabled) rokuDeviceSelect.value = host;
        localStorage.setItem("m3u-guide-roku-host", host);
        updateRokuControls(`Found ${guideState.roku.deviceName}${device?.model ? ` · ${device.model}` : ""} at ${host}.`);
        rokuButton.title = `${guideState.roku.deviceName} · ${host}`;
      }

      async function discoverRoku(attempt = 0) {
        const prior = rokuDiscoverButton.textContent;
        rokuDiscoverButton.disabled = true;
        rokuDiscoverButton.textContent = "Scanning…";
        guideEls.rokuStatus.textContent = "Discovering Roku devices on the local subnet…";
        try {
          const response = await fetch(`/api/guide/roku/discover?_=${Date.now()}`, {cache: "no-store"});
          const data = await response.json();
          if (!response.ok || !data.ok) throw new Error(data.error || "Roku discovery failed.");
          const devices = Array.isArray(data.devices) ? data.devices : [];
          if (!devices.length) {
            clearRokuDiscovery(data.warning || `No Roku found${data.subnet ? ` on ${data.subnet}` : ""}.`);
            if (attempt < 2) window.setTimeout(() => discoverRoku(attempt + 1), 2500);
            return;
          }
          const savedHost = localStorage.getItem("m3u-guide-roku-host") || "";
          const selected = devices.find(device => device.host === savedHost) || devices[0];
          renderRokuChoices(devices, selected?.host || "");
          useDiscoveredRoku(selected);
        } catch (error) {
          clearRokuDiscovery(`Roku discovery failed: ${error?.message || error}.`);
          console.error("Automatic Roku discovery failed", error);
        } finally {
          rokuDiscoverButton.disabled = false;
          rokuDiscoverButton.textContent = prior;
        }
      }

      function applyCastAvailability(state) {
        if (!window.cast?.framework || !guideState.cast.context) return false;
        const castState = state || guideState.cast.context.getCastState?.();
        const available = Boolean(castState) && castState !== cast.framework.CastState.NO_DEVICES_AVAILABLE;
        if (available) {
          castButton.title = "Google Cast receiver available";
          updateCastStatus();
        } else {
          castButton.disabled = true;
          castButton.title = "No Google Cast receivers found";
          guideEls.castStatus.textContent = "No Google Cast receivers found.";
        }
        return true;
      }

      function attachCastDiscovery(attempt) {
        const count = Number(attempt || 0);
        if (window.cast?.framework && guideState.cast.context) {
          applyCastAvailability();
          guideState.cast.context.addEventListener(
            cast.framework.CastContextEventType.CAST_STATE_CHANGED,
            event => applyCastAvailability(event.castState)
          );
          return;
        }
        if (count < 100) window.setTimeout(() => attachCastDiscovery(count + 1), 100);
      }

      function setRemoteTransitionBusy(busy) {
        remoteTransitionBusy = Boolean(busy);
        if (remoteTransitionBusy) {
          castButton.disabled = true;
          rokuButton.disabled = true;
        }
      }

      async function withRemoteTransition(work) {
        if (remoteTransitionBusy) return;
        setRemoteTransitionBusy(true);
        try {
          await work();
        } finally {
          remoteTransitionBusy = false;
          updateRokuControls();
          updateCastStatus();
          syncRemoteButtonStyle(castButton);
          syncRemoteButtonStyle(rokuButton);
        }
      }

      async function waitForCastSessionEnd(timeoutMs = 4000) {
        const deadline = Date.now() + timeoutMs;
        while (currentCastSession() && Date.now() < deadline) {
          await new Promise(resolve => window.setTimeout(resolve, 75));
        }
        return !currentCastSession();
      }

      async function stopCastForRemoteSwitch() {
        if (!currentCastSession()) return;
        await stopRemoteMedia();
        await stopCastRelay();
        guideState.cast.lastMediaUrl = "";
        guideState.cast.context.endCurrentSession(true);
        const ended = await waitForCastSessionEnd();
        if (!ended) throw new Error("Cast session did not disconnect before Roku handoff.");
      }

      function finishCastDisconnectHandoff(id) {
        const pending = castDisconnectHandoff;
        if (!pending || pending.id !== id) return;
        castDisconnectHandoff = null;
        if (!pending.channel) return;
        if (currentCastSession()) return;
        if (!sameChannel(guideState.currentChannel, pending.channel)) return;
        playLocalChannel(pending.channel);
      }

      async function disconnectRokuToLocal() {
        if (!guideState.roku.active) return;
        const channel = guideState.currentChannel;
        await stopRokuPlayback({sendHome: true});
        if (channel && sameChannel(guideState.currentChannel, channel) && !guideState.roku.active) {
          playLocalChannel(channel);
        }
      }

      async function disconnectCastToLocal() {
        if (!currentCastSession()) return;
        const channel = guideState.currentChannel;
        const id = ++castDisconnectSequence;
        castDisconnectHandoff = {id, channel: channel || null};
        try {
          await stopRemoteMedia();
          await stopCastRelay();
          guideState.cast.lastMediaUrl = "";
          guideState.cast.context.endCurrentSession(true);
          const ended = await waitForCastSessionEnd();
          if (ended) finishCastDisconnectHandoff(id);
        } catch (error) {
          if (castDisconnectHandoff?.id === id) castDisconnectHandoff = null;
          console.error("Could not hand Cast playback back to the browser", error);
        }
      }

      async function handleRokuButtonClick(event) {
        event.preventDefault();
        event.stopImmediatePropagation();
        if (remoteTransitionBusy) return;

        await withRemoteTransition(async () => {
          if (guideState.roku.active) {
            await disconnectRokuToLocal();
            return;
          }

          const channel = guideState.currentChannel;
          if (!channel) {
            updateRokuControls("Press Play on a channel first.");
            return;
          }

          if (currentCastSession()) {
            await stopCastForRemoteSwitch();
          }
          if (sameChannel(guideState.currentChannel, channel)) {
            await toggleRoku();
          }
        });
      }

      async function handleCastButtonClick(event) {
        event.preventDefault();
        event.stopImmediatePropagation();
        if (remoteTransitionBusy) return;

        await withRemoteTransition(async () => {
          if (currentCastSession()) {
            await disconnectCastToLocal();
            return;
          }

          await toggleCast();
        });
      }

      function attachCastDisconnectHandoff(attempt) {
        const count = Number(attempt || 0);
        if (window.cast?.framework && guideState.cast.context) {
          guideState.cast.context.addEventListener(
            cast.framework.CastContextEventType.SESSION_STATE_CHANGED,
            event => {
              if (event.sessionState !== cast.framework.SessionState.SESSION_ENDED) return;
              const pending = castDisconnectHandoff;
              if (!pending) return;
              finishCastDisconnectHandoff(pending.id);
            }
          );
          return;
        }
        if (count < 100) window.setTimeout(() => attachCastDisconnectHandoff(count + 1), 100);
      }

      rokuDeviceSelect.addEventListener("change", () => {
        const device = discoveredRokus.find(item => item.host === rokuDeviceSelect.value);
        if (device) useDiscoveredRoku(device);
      });
      rokuDiscoverButton.addEventListener("click", () => discoverRoku(0));
      rokuButton.addEventListener("click", handleRokuButtonClick, true);
      castButton.addEventListener("click", handleCastButtonClick, true);
      discoverRoku();
      attachCastDiscovery(0);
      attachCastDisconnectHandoff(0);
    })();
  </script>
  <script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
</body>
</html>
