<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>M3U Web Picker — Remote</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
  <link rel="manifest" href="{{ url_for('static', filename='remote.webmanifest') }}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/guide.css', v='guide-days-2') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/guide_programmes.css', v='guide-mobile-logos-1') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/ui_themes.css', v='theme-pack-2') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/ui_sidebar_tweaks.css', v='theme-pack-2') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/guide_theme.css', v='guide-theme-2') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/remote.css', v='remote-sports-live-1') }}">
</head>
<body class="guide-body remote-body">
  <main class="guide-shell remote-shell container-fluid py-2">
    <header class="guide-header remote-header mb-3">
      <div class="guide-header-copy">
        <h1 class="h4 mb-1">Remote</h1>
        <div class="small-muted">Channel 0.2 · one television output</div>
      </div>
      <div class="remote-header-actions">
        <button id="remoteAlertsButton" class="btn btn-outline-warning btn-sm" type="button">Enable alerts</button>
        <button id="remoteDisableAlertsButton" class="btn btn-link btn-sm d-none" type="button">Turn off</button>
        <button id="remoteGuideButton" class="btn btn-outline-light btn-sm" type="button">TV Guide</button>
      </div>
    </header>

    <section class="remote-controls mb-3" aria-label="Channel search">
      <div class="remote-mode-switch btn-group w-100 mb-2" role="group" aria-label="Remote mode">
        <button class="btn btn-outline-light active" type="button" data-remote-mode="tv">TV</button>
        <button class="btn btn-outline-light" type="button" data-remote-mode="sports">Sports</button>
      </div>
      <label class="form-label mb-1" for="remoteSearch">
        <span id="remoteListLabel">Channels</span> <span id="remoteCount" class="small-muted">(loading…)</span>
      </label>
      <input id="remoteSearch" class="form-control" type="search" placeholder="Channel or current show…" autocomplete="off">
    </section>

    <div id="remoteStatus" class="remote-status small-muted mb-2" role="status" aria-live="polite">Loading channel 0.2…</div>

    <section id="remoteCurrent" class="remote-current mb-3" aria-label="Currently playing"></section>

    <section aria-labelledby="remoteAvailableHeading">
      <h2 id="remoteAvailableHeading" class="h6 remote-list-heading">Available channels</h2>
      <div id="remoteChannels" class="remote-channel-list"></div>
      <div id="remoteEmpty" class="guide-empty d-none">No enabled channels match this search.</div>
    </section>

    <nav id="remoteSportsFilters" class="remote-sports-filters d-none" aria-label="Sports filters"></nav>
  </main>

  <script>
    (() => {
      const saved = localStorage.getItem("m3u-picker.ui.theme") || "midnight";
      const valid = new Set(["midnight","slate","oled-black","carbon","light","ice","terminal-amber","terminal-green","cornfield","ketchup-mustard"]);
      document.body.dataset.uiTheme = valid.has(saved) ? saved : "midnight";
    })();
  </script>
  <script src="{{ url_for('static', filename='js/remote.js', v='remote-phone-alerts-1') }}"></script>
</body>
</html>
